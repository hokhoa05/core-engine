syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.trading.api_gateway.grpc";
option java_outer_classname = "EngineProto";

option go_package = "github.com/hokhoa05/core-engine/pb"; 

package engine;

service MatchingEngine {
  rpc PushOrder (OrderRequest) returns (OrderResponse);
}

service SettlementEngine {
  rpc ReportTrade (TradeReportRequest) returns (TradeReportResponse);
}

message OrderRequest {
  int64 order_id = 1;
  int64 user_id = 2;
  string side = 3;
  int64 price = 4;
  int64 qty = 5;
}

message OrderResponse {
  bool success = 1;
  string message = 2;
}

message TradeReportRequest {
  int64 maker_order_id = 1;
  int64 taker_order_id = 2;
  int64 maker_user_id = 3;
  int64 taker_user_id = 4;
  int64 price = 5;
  int64 qty = 6;
}

message TradeReportResponse {
  bool success = 1;
}